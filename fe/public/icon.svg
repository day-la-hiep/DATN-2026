<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Medical Gradient -->
    <linearGradient id="derma-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0052FF"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>

    <!-- Droplet Gradient -->
    <linearGradient id="drop-grad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>

    <!-- Soft Depth Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#031640" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#derma-bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="white" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- Skin Cross-Section Layers (3 tầng cấu trúc da: Biểu bì, Trung bì, Hạ bì) -->
  <g filter="url(#shadow)">
    <!-- Layer 1: Epidermis / Bề mặt biểu bì da -->
    <path d="M 12 42 C 18 39, 25 43, 32 40 C 39 37, 46 41, 52 39" 
          stroke="#FFFFFF" 
          stroke-width="3.5" 
          stroke-linecap="round"/>

    <!-- Layer 2: Dermis / Trung bì da -->
    <path d="M 14 48 C 20 45.5, 26 49, 32 46.5 C 38 44, 44 47.5, 50 45.5" 
          stroke="#BAE6FD" 
          stroke-width="2.8" 
          stroke-linecap="round" 
          stroke-opacity="0.85"/>

    <!-- Layer 3: Hypodermis / Hạ bì da -->
    <path d="M 16 54 C 21.5 52, 27 55, 32 53 C 37 51, 42.5 54, 48 52" 
          stroke="#7DD3FC" 
          stroke-width="2.2" 
          stroke-linecap="round" 
          stroke-opacity="0.55"/>

    <!-- Serum Droplet nourishing the skin (Giọt tinh chất phục hồi da) -->
    <path d="M 32 8.5 
             C 32 8.5, 19.5 20.5, 19.5 26.5 
             C 19.5 33.4 25 36.5 32 36.5 
             C 39 36.5 44.5 33.4 44.5 26.5 
             C 44.5 20.5, 32 8.5, 32 8.5 Z" 
          fill="url(#drop-grad)"/>

    <!-- Clinical Medical Cross inside droplet -->
    <rect x="29.75" y="19.5" width="4.5" height="13" rx="2.25" fill="#0052FF"/>
    <rect x="25.5" y="23.75" width="13" height="4.5" rx="2.25" fill="#0052FF"/>

    <!-- Droplet Shine / Gloss Highlight -->
    <path d="M 23.5 23 C 23 25, 23.5 27.5, 25 29" 
          stroke="white" 
          stroke-width="1.5" 
          stroke-linecap="round" 
          stroke-opacity="0.9"/>
  </g>

  <!-- AI & Healthy Skin Radiance Sparkle -->
  <path d="M 48 8.5 Q 48 13 52.5 13 Q 48 13 48 17.5 Q 48 13 43.5 13 Q 48 13 48 8.5 Z" fill="#67E8F9"/>
  <circle cx="48" cy="13" r="1.1" fill="#FFFFFF"/>
</svg>
