name: derma-hospital

# Infra cho backend (core/): PostgreSQL + Redis (Pub/Sub) + RabbitMQ (queue) +
# Qdrant (vector DB — long-term memory Agent, xem core/app/agent/memory.py) + Neo4j
# (knowledge graph da liễu từ PrimeKG, xem data/PrimeKG/processed/ +
# core/app/agent/knowledge_graph.py) + MinIO (object storage — ảnh đính kèm tin nhắn
# cho core/app/agent/tools/skin_image_classifier.py, xem
# core/app/infra/file_storage.py).
#
# Nếu máy bạn ĐÃ có sẵn 1 MinIO khác chạy ngoài compose này (đụng cổng 9000/9001):
# đổi `MINIO_PORT`/`MINIO_CONSOLE_PORT` (biến môi trường) hoặc trỏ thẳng
# `MINIO_ENDPOINT`/`MINIO_ACCESS_KEY`/`MINIO_SECRET_KEY` (core/app/core/config.py) vào
# instance đó, không cần khởi động service `minio` bên dưới.
# App (core, agent worker, fe) vẫn chạy thủ công như hiện tại:
#   docker compose up -d
#   cd core && python main.py
#   cd core && python -u -m app.agent.worker
#   cd fe   && pnpm dev
#
# Giá trị mặc định bên dưới khớp với default trong `core/app/core/config.py` nên
# không cần chỉnh .env để chạy dev.

services:
  postgres:
    image: postgres:16-alpine
    container_name: derma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-derma_hospital_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-derma_hospital_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - derma-net

  redis:
    image: redis:7-alpine
    container_name: derma-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - derma-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: derma-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"     # AMQP
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"  # Management UI (guest/guest)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - derma-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: derma-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"      # REST
      - "${QDRANT_GRPC_PORT:-6334}:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - derma-net

  neo4j:
    image: neo4j:5-community
    container_name: derma-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-derma12345}
      # APOC: không bắt buộc cho script nạp dữ liệu (`data/PrimeKG/load_to_neo4j.py`,
      # dùng driver Python thuần) — bật sẵn để agent có thể tận dụng khi sinh Cypher
      # (vd `apoc.meta.schema`) qua GraphCypherQAChain.
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"  # Browser UI
      - "${NEO4J_BOLT_PORT:-7687}:7687"  # Bolt (driver, langchain-neo4j)
    volumes:
      - neo4j_data:/data
      - neo4j_import:/import
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - derma-net

  minio:
    image: quay.io/minio/minio:latest
    container_name: derma-minio
    restart: unless-stopped
    environment:
      # Khớp default `MINIO_ACCESS_KEY`/`MINIO_SECRET_KEY` trong
      # `core/app/core/config.py` — không cần chỉnh `.env` để chạy dev.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"          # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"  # Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - derma-net

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  qdrant_data:
  neo4j_data:
  neo4j_import:
  minio_data:

networks:
  derma-net:
    driver: bridge
