[project]
name = "core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.4",
    "asyncpg>=0.29",
    "celery>=5.4",
    "fastapi[standard]>=0.141.1",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "langchain-google-vertexai>=3.2.4",
    "langchain[google-genai]>=0.3",
    "langgraph>=0.2",
    "pydantic-settings>=2.0",
    "qdrant-client>=1.19.0",
    "redis>=5.0",
    "sqlalchemy>=2.0.52",
]

[tool.fastapi]
entrypoint = "main:app"

[tool.pyright]
typeCheckingMode = "strict"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pyyaml>=6.0.3",
]
