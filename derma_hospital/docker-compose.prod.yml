# Compose PRODUCTION — build image từ source (core/Dockerfile, fe/Dockerfile) và chạy
# TOÀN BỘ stack (infra + app) trong 1 mạng Docker riêng, khác `docker-compose.yml` (dev,
# chỉ chạy infra, app chạy thủ công ngoài Docker).
#
# KHÔNG kèm cloudflared/tunnel ở đây — tự cấu hình riêng, trỏ vào `fe` cổng 3000 (đã
# publish ra host bên dưới, xem `ports:` của service `fe`). FE tự proxy `/api/v1/*`
# sang `core-api` qua `next.config.ts::rewrites` (biến `BACKEND_URL` đã set sẵn), nên
# tunnel/reverse-proxy CHỈ CẦN trỏ 1 hostname vào `fe`, không cần lộ core-api riêng —
# trừ khi muốn định tuyến `/api/v1/*` thẳng tới `core-api:3050` (SSE ổn định hơn qua
# rewrite), khi đó publish thêm port 3050 của `core-api` và trỏ path đó riêng.
#
# ── Chuẩn bị trước khi chạy ─────────────────────────────────────────────────────────
# 1. Copy `.env.prod.example` -> `.env` (CÙNG THƯ MỤC file này — Docker Compose tự nạp
#    `.env` để thay `${VAR}` bên dưới), điền mật khẩu DB/MinIO/Neo4j THẬT (khác default
#    dev).
# 2. Copy `core/.env.example` -> `core/.env`, điền `OPENROUTER_API_KEY` +
#    `APP_ACCESS_TOKEN` (mã bạn sẽ gửi cho người test) — các biến kết nối hạ tầng
#    (DATABASE_URL/REDIS_HOST/...) trong file đó KHÔNG cần sửa, compose này tự override
#    đúng hostname nội bộ (`environment:` bên dưới ghi đè `env_file:`, xem mục "Kết nối
#    nội bộ").
#
# ── Chạy ─────────────────────────────────────────────────────────────────────────────
#   docker compose -f docker-compose.prod.yml up -d --build
#   ./reset-and-gen-data.sh          (nạp/reset Qdrant KB + Neo4j PrimeKG/DermO — xem file đó)
#
# ── Kết nối nội bộ (core-api/agent-worker override từ core/.env) ────────────────────
# Container gọi nhau bằng TÊN SERVICE (DNS nội bộ Docker network), không phải
# "localhost" như trong `core/.env` (viết cho chạy thủ công ngoài Docker).

name: derma-hospital-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ${POSTGRES_DB:-derma_hospital_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-derma_hospital_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [derma-net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [derma-net]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Đặt RABBITMQ_PASSWORD trong .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [derma-net]

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [derma-net]

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Đặt NEO4J_PASSWORD trong .env}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_import:/import
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [derma-net]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Đặt MINIO_ROOT_USER trong .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Đặt MINIO_ROOT_PASSWORD trong .env}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [derma-net]

  derma-core-api:
    build:
      context: .
      dockerfile: core/Dockerfile
    restart: unless-stopped
    env_file: core/.env
    environment:
      # Ghi đè đúng hostname nội bộ Docker network — mọi giá trị khác (API key, model,
      # APP_ACCESS_TOKEN...) lấy nguyên từ core/.env (`env_file:` ở trên).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-derma_hospital_db}
      REDIS_HOST: redis
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      QDRANT_URL: http://qdrant:6333
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # CORS mở cho FE (hoặc tunnel/reverse-proxy của bạn) gọi trực tiếp core-api nếu
      # định tuyến /api/v1/* thẳng tới core-api thay vì qua FE rewrite — không ảnh
      # hưởng nếu chỉ dùng đường FE tự proxy.
      CORS_ORIGINS: '["*"]'
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      qdrant: {condition: service_started}
      neo4j: {condition: service_healthy}
      minio: {condition: service_healthy}
    networks: [derma-net]

  agent-worker:
    build:
      context: .
      dockerfile: core/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.agent.worker"]
    env_file: core/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-derma_hospital_db}
      REDIS_HOST: redis
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      QDRANT_URL: http://qdrant:6333
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      qdrant: {condition: service_started}
      neo4j: {condition: service_healthy}
      minio: {condition: service_healthy}
    networks: [derma-net]

  derma-fe:
    build:
      context: fe
      dockerfile: Dockerfile
      args:
        # Bake vào rewrite lúc `next build` (next.config.ts) — đổi giá trị phải rebuild
        # image (`up -d --build derma-fe`); env runtime không có tác dụng.
        BACKEND_URL: http://derma-core-api:3050
    restart: unless-stopped
    ports:
      # Publish ra host để tunnel/reverse-proxy tự cấu hình (cloudflared, nginx...) trỏ
      # vào đây — đổi cổng host bên trái nếu 3000 đã bị chiếm.
      - "3000:3000"
    depends_on:
      - derma-core-api
    networks: [derma-net]

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  qdrant_data:
  neo4j_data:
  neo4j_import:
  minio_data:

networks:
  derma-net:
    driver: bridge
