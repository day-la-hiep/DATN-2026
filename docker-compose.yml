name: derma-hospital

# Infra cho backend (core/): PostgreSQL + Redis (Pub/Sub) + RabbitMQ (queue) +
# Qdrant (vector DB — long-term memory Agent, xem core/app/agent/memory.py) + Neo4j
# (knowledge graph da liễu từ PrimeKG, xem core/data-ingest/primekg/ +
# core/app/agent/knowledge_graph.py) + MinIO (object storage — ảnh đính kèm tin nhắn
# cho core/app/agent/tools/skin_image_classifier.py, xem
# core/app/infra/file_storage.py).
#
# Nếu máy bạn ĐÃ có sẵn 1 MinIO khác chạy ngoài compose này (đụng cổng 9000/9001):
# sửa thẳng cổng ở service `minio` bên dưới hoặc trỏ `MINIO_ENDPOINT`/`MINIO_ACCESS_KEY`/
# `MINIO_SECRET_KEY` (core/app/core/config.py) vào instance đó, không cần khởi động
# service `minio`.
# App (core, agent worker, fe) vẫn chạy thủ công như hiện tại:
#   docker compose up -d
#   cd core && python main.py
#   cd core && python -u -m app.agent.worker
#   cd fe   && pnpm dev
#
# Mọi giá trị ở đây ghi thẳng (không đọc biến môi trường/.env) và khớp default trong
# `core/app/core/config.py`. Muốn đổi thì sửa trực tiếp file này.

services:
  postgres:
    image: postgres:16-alpine
    container_name: derma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: derma_hospital_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d derma_hospital_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - derma-net

  redis:
    image: redis:7-alpine
    container_name: derma-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - derma-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: derma-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"  # Management UI (guest/guest)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - derma-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: derma-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: derma_qdrant_2026
    ports:
      - "6333:6333"      # REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - derma-net

  neo4j:
    image: neo4j:5-community
    container_name: derma-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/derma12345
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"  # Browser UI
      - "7687:7687"  # Bolt (driver, langchain-neo4j)
    volumes:
      - neo4j_data:/data
      - neo4j_import:/import
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - derma-net

  minio:
    image: quay.io/minio/minio:latest
    container_name: derma-minio
    restart: unless-stopped
    environment:
      # Khớp default `MINIO_ACCESS_KEY`/`MINIO_SECRET_KEY` trong `core/app/core/config.py`.
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"          # S3 API
      - "9001:9001"  # Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - derma-net

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  qdrant_data:
  neo4j_data:
  neo4j_import:
  minio_data:

networks:
  derma-net:
    driver: bridge
